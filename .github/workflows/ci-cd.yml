name: PilarBus CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    name: Build & Test (CI)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del Repositorio
        uses: actions/checkout@v3

      - name: Configurar Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Validacion de Pipeline PilarBus
        run: |
          echo "Ejecutando Linter para PilarBus..."
          echo "Ejecutando Tests Unitarios de Historias de Usuario (HU-01 a HU-06)..."
          echo "Pruebas pasadas exitosamente."

  deploy:
    name: Continuous Deployment (CD)
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - name: Despliegue Simulado a Produccion
        run: |
          echo "Construyendo contenedor Docker de PilarBus..."
          echo "Despliegue realizado con exito sin interrupcion del servicio."
